server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Svelte SPA routing support
    location / {
        try_files $uri $uri/ /index.html @redirect_to_auth;
    }

    # Отдельно обрабатываем путь /auth, чтобы он отдавал index.html (или страницу авторизации)
    location /auth {
        try_files $uri /index.html;
    }

    # Внутренний редирект на /auth для всех несуществующих путей
    location @redirect_to_auth {
        return 302 /auth;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
}