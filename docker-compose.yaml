version: '3.7'
services:
  postgres:
    image: postgres:18
    container_name: date-manager_pg
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: date-manager_backend
    expose:
      - "3000"
    environment:
      - PORT=${PORT}

      - IS_DEV=${IS_DEV}

      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}

      - JWT_SECRET=${JWT_SECRET}
      
      - FILE_SIZE=${FILE_SIZE}
    volumes:
      - storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: date-manager_frontend
    expose:
      - "80"
    environment:
      - VITE_PUBLIC_HTTP_SERVER_URL=${VITE_PUBLIC_HTTP_SERVER_URL}
      - VITE_IS_DEV=${VITE_IS_DEV}
    depends_on:
      - backend
    networks:
      - app-network

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro   # для сертификатов (если используем свои)
      - ./certbot/www:/var/www/certbot   # для верификации Let's Encrypt
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network

volumes:
  postgres_data:
  storage:

networks:
  app-network:
    driver: bridge